[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "Small log-intelligence model: flags incidents and ranks the log lines that explain them, on CPU."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Naman Kundra" }]
dependencies = [
  "numpy",
  "pyyaml",
  "tokenizers",
  "polars",
  "pyarrow",
  "typer",
  "scikit-learn",
]

[project.optional-dependencies]
train = ["torch", "wandb"]
serve = ["onnxruntime", "fastapi", "uvicorn"]
baselines = ["drain3"]
dev = ["pytest", "ruff"]

[project.scripts]
loglens = "loglens.serve.cli:app"

[tool.setuptools.packages.find]
include = ["loglens*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
